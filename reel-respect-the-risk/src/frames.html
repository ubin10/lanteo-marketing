<!doctype html>
<!-- "Respect the risk" reel: text frames. One frame per ?f=<id>.
     o-* frames render on a transparent ground (overlays on the ride footage).
     Plate style matches the Week 1 reel overlays. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url('../../brand/fonts/space-grotesk-latin.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:100 900;src:url('../../brand/fonts/inter-latin.woff2') format('woff2')}
:root{--ink:#080e18;--line:#1a2d44;--jade:#0EA47D;--breach:#ff3d5a;--tx:#ddeeff;--tx2:#8ba3bf;
  --display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
.frame{display:none;position:absolute;inset:0;color:var(--tx);font-family:var(--body)}
.frame.on{display:block}
.u{position:relative;white-space:nowrap}
.u::after{content:"";position:absolute;left:-2%;right:-2%;bottom:.02em;height:.12em;border-radius:.06em}
.u--bad::after{background:var(--breach)}
/* plates sit in the top safe band: below ~250px of app UI, above the sky-to-road line */
.plate{position:absolute;left:70px;right:150px;top:290px;
  background:rgba(8,14,24,.84);border:1px solid rgba(26,45,68,.9);border-radius:22px;
  padding:40px 50px 46px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 60px -24px rgba(0,0,0,.9)}
.plate h2{font-family:var(--display);font-weight:600;font-size:80px;line-height:1.08;letter-spacing:-.02em}
/* the black card */
#risk{background:#05080e}
#risk h1{position:absolute;left:0;right:0;top:820px;text-align:center;
  font-family:var(--display);font-weight:600;font-size:118px;letter-spacing:-.03em}
</style>
</head>
<body>
<section class="frame" id="o-t1"><div class="plate"><h2>Two good corners.</h2></div></section>
<section class="frame" id="o-t2"><div class="plate"><h2>Then the one you didn’t slow down for.</h2></div></section>
<section class="frame" id="risk"><h1>Respect the <span class="u u--bad">risk.</span></h1></section>
<script>document.getElementById(new URLSearchParams(location.search).get('f')||'risk').classList.add('on')</script>
</body>
</html>
